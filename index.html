<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velour — Premium Avtomobil Ijarasi</title>
<link rel="stylesheet" href="style.css">
<script src="velour.js"></script>
</head>
<body>

<div id="nav-root"></div>

<section class="hero">
  <div>
    <div class="hero-badge" id="h-badge"></div>
    <h1 id="h-h1"></h1>
    <p class="hero-sub" id="h-sub"></p>
    <div class="divider"></div>
    <div class="hero-btns">
      <a class="btn-primary" href="pages/browse.html" id="h-btn1"></a>
    </div>
    <div class="hero-stats">
      <div><div class="stat-num" id="stat-d">0</div><div class="stat-label" id="sl-d"></div></div>
      <div><div class="stat-num" id="stat-c">0</div><div class="stat-label" id="sl-c"></div></div>
      <div><div class="stat-num">42</div><div class="stat-label" id="sl-ci"></div></div>
    </div>
  </div>
</section>

<div style="background:var(--cream-dark);padding:4rem 3rem;text-align:center;">
  <div style="max-width:900px;margin:0 auto;">
    <div class="section-tag" id="std-tag"></div>
    <h2 class="serif" id="std-h2" style="font-size:2.2rem;margin-bottom:0.8rem;"></h2>
    <p id="std-p" style="color:var(--text-muted);font-size:0.85rem;line-height:2;max-width:560px;margin:0 auto 3rem;"></p>
    <div class="how-grid">
      <div class="how-item"><div class="how-num">I</div><div class="how-title" id="hw1t"></div><div class="how-desc" id="hw1d"></div></div>
      <div class="how-item"><div class="how-num">II</div><div class="how-title" id="hw2t"></div><div class="how-desc" id="hw2d"></div></div>
      <div class="how-item"><div class="how-num">III</div><div class="how-title" id="hw3t"></div><div class="how-desc" id="hw3d"></div></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-tag" id="ft"></div>
  <h2 id="fh"></h2>
  <p class="section-sub" id="fs"></p>
  <div class="cars-grid" id="grid"></div>
  <div style="text-align:center;margin-top:2.5rem;">
    <a class="btn-outline" href="pages/browse.html" id="fb"></a>
  </div>
</div>

<footer style="background:var(--navy);color:rgba(250,247,242,0.5);text-align:center;padding:2rem;font-size:0.72rem;letter-spacing:1px;border-top:1px solid rgba(184,151,42,0.3);">
  <span id="foot"></span>
</footer>

<script>
document.getElementById('nav-root').innerHTML = buildNav('','');

function s(id,k){ var e=document.getElementById(id); if(e) e.textContent=t(k); }
s('h-badge','hero_badge');
document.getElementById('h-h1').innerHTML = t('hero_h1_1')+' <em>'+t('hero_h1_2')+'</em>';
s('h-sub','hero_sub'); s('h-btn1','hero_btn1');
s('sl-d','stat_drivers'); s('sl-c','stat_cars'); s('sl-ci','stat_cities');
s('std-tag','standard_tag'); s('std-h2','standard_h2'); s('std-p','standard_p');
s('hw1t','how1_title'); s('hw1d','how1_desc');
s('hw2t','how2_title'); s('hw2d','how2_desc');
s('hw3t','how3_title'); s('hw3d','how3_desc');
s('ft','featured_tag'); s('fh','featured_h2'); s('fs','featured_sub'); s('fb','featured_btn');
document.getElementById('foot').innerHTML = t('footer').replace('VELOUR','<span style="color:var(--gold-light)">VELOUR</span>');

var cars = getCars();
document.getElementById('stat-d').textContent = cars.length;
document.getElementById('stat-c').textContent = cars.length;

var featured = cars.slice(-3).reverse();
var grid = document.getElementById('grid');
if(!featured.length){
  grid.innerHTML = '<div class="empty-state"><h3>'+t('empty_h3')+'</h3><p>'+t('empty_p')+'<br><a href="pages/browse.html" style="color:var(--gold);">'+t('nav_browse')+' \u2192</a></p></div>';
} else {
  grid.innerHTML = featured.map(function(c){ return carCard(c,'pages/'); }).join('');
}
</script>
</body>
</html>
