      <div style="display:flex;gap:1.5rem;align-items:flex-start;"><div style="font-family:'Playfair Display',serif;font-size:2.8rem;color:var(--gold-pale);min-width:52px;line-height:1;">1</div><div><div style="font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:0.4rem;" id="d1t"></div><div style="font-size:0.82rem;color:var(--text-muted);line-height:1.9;" id="d1d"></div></div></div>

</footer>

<script>
document.getElementById('nav-root').innerHTML = buildNavSub();
function s(id,k){var e=document.getElementById(id);if(e)e.textContent=t(k);}
s('htag','how_tag'); s('hh2','how_h2'); s('hsub','how_sub');
s('for-c','for_clients'); s('for-d','for_drivers');
s('c1t','c1_title'); s('c1d','c1_desc');
s('c2t','c2_title'); s('c2d','c2_desc');
s('c3t','c3_title'); s('c3d','c3_desc');
s('d1t','d1_title'); s('d1d','d1_desc');
s('d2t','d2_title'); s('d2d','d2_desc');
s('d3t','d3_title'); s('d3d','d3_desc');
s('hquote','how_quote'); s('hbtn','nav_browse');
document.getElementById('foot').innerHTML=t('footer').replace('VELOUR','<span style="color:var(--gold-light)">VELOUR</span>');
</script>
